name: Update offers

on:
  schedule:
    # GitHub may delay or skip scheduled runs when busy (worst at :00/:30),
    # so run twice a day at quieter minutes: 05:47 and 17:47 Sri Lanka time.
    - cron: "17 0 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:        # adds a "Run workflow" button on GitHub

permissions:
  contents: write           # needed to commit the refreshed offers.json

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scrape all banks
        run: python scraper/scrape.py

      - name: Publish if anything changed
        run: |
          cp data/offers.json mobile/assets/offers.json
          git config user.name "offers-bot"
          git config user.email "offers-bot@users.noreply.github.com"
          git add data/offers.json mobile/assets/offers.json
          if git diff --cached --quiet; then
            echo "No changes in offers today."
          else
            git commit -m "Update offers $(date -u +%Y-%m-%d)"
            git push
          fi

      # Runs after publishing, so fresh offers still go out; if the new data
      # has problems (duplicates, broken text, a bank missing...) the run is
      # marked failed and GitHub sends an email.
      - name: Check the data
        run: python -m unittest discover tests -v
