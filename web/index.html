<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credit Card Offers LK</title>
<meta name="description" content="Every credit & debit card discount from Sri Lanka's banks — pick your cards, see only what's yours.">
<meta name="theme-color" content="#1E1B4B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Card Offers LK">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Light ("Indigo"): lively shopping-app look, coral-orange deal badges.
     Dark ("Platinum"): black/platinum-card look, soft indigo, gold badges.
     Which one shows follows the visitor's light/dark system setting. */
  :root {
    --bg: #F9FAFB;
    --card: #FFFFFF;
    --text: #111827;
    --muted: #6B7280;
    --border: #E5E7EB;
    --brand-deep: #1E1B4B;
    --brand: #4F46E5;        /* modern indigo: selected chips, saved heart */
    --brand-on: #FFFFFF;     /* text on --brand */
    --accent: #4F46E5;       /* focus rings, hovers */
    --accent-ink: #4338CA;   /* indigo text on white */
    --accent-soft: #EEF2FF;
    --deal: #F97316;         /* coral orange: % off badges */
    --deal-on: #FFFFFF;
    --deal-ink: #C2410C;     /* orange text on white */
    --cat-bg: #EEF2FF;       /* category tags */
    --cat-text: #4F46E5;
    --chip: #FFFFFF;
    --chip-shadow: rgba(79, 70, 229, .35);
    --danger: #DC2626;
    --danger-soft: #FEE2E2;
    --shadow: 0 1px 3px rgba(17, 24, 39, .06), 0 6px 18px rgba(17, 24, 39, .05);
    --shadow-hover: 0 4px 10px rgba(17, 24, 39, .10), 0 14px 32px rgba(17, 24, 39, .10);
    --overlay: rgba(17, 24, 39, .6);
    --hero-grad: linear-gradient(130deg, #1E1B4B 0%, #312E81 38%, #4F46E5 74%, #7C3AED 100%);
    --hero-glow-a: rgba(167, 139, 250, .40);
    --hero-glow-b: rgba(249, 115, 22, .28);
    --hero-orb: rgba(196, 181, 253, .30);
    --hero-tint: #E0E7FF;
    --hero-tint-2: #EEF2FF;
    --live-dot: #FB923C;
    --title-grad: linear-gradient(90deg, #C7D2FE, #FDBA74);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0B0F19;          /* rich obsidian */
      --card: #111827;
      --text: #F9FAFB;
      --muted: #9CA3AF;       /* soft silver */
      --border: #1F2937;
      --brand-deep: #05070D;
      --brand: #818CF8;       /* soft indigo */
      --brand-on: #0B0F19;
      --accent: #818CF8;
      --accent-ink: #A5B4FC;
      --accent-soft: #1A1A3A;
      --deal: #F59E0B;        /* gold / amber */
      --deal-on: #1A1100;
      --deal-ink: #FBBF24;
      --cat-bg: #1F2937;
      --cat-text: #A5B4FC;
      --chip: #151D2C;
      --chip-shadow: rgba(129, 140, 248, .30);
      --danger: #F87171;
      --danger-soft: #3B1515;
      --shadow: 0 1px 3px rgba(0, 0, 0, .5);
      --shadow-hover: 0 8px 28px rgba(0, 0, 0, .6);
      --overlay: rgba(0, 0, 0, .75);
      --hero-grad: linear-gradient(130deg, #05070D 0%, #0B0F19 40%, #111827 72%, #1F2937 100%);
      --hero-glow-a: rgba(129, 140, 248, .24);
      --hero-glow-b: rgba(245, 158, 11, .16);
      --hero-orb: rgba(229, 231, 235, .10);
      --hero-tint: #CBD5E1;
      --hero-tint-2: #E5E7EB;
      --live-dot: #34D399;
      --title-grad: linear-gradient(90deg, #E5E7EB, #818CF8);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(900px 420px at 110% -5%, var(--accent-soft) 0%, transparent 55%),
      radial-gradient(700px 380px at -15% 30%, var(--accent-soft) 0%, transparent 50%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, .merchant { font-family: "Outfit", "Inter", sans-serif; }

  /* ---------- Hero header ---------- */
  .hero {
    position: relative;
    overflow: hidden;
    color: #fff;
    padding: calc(46px + env(safe-area-inset-top, 0px)) 16px 96px;
    background:
      radial-gradient(800px 360px at 88% -20%, var(--hero-glow-a), transparent 60%),
      radial-gradient(640px 320px at -5% 120%, var(--hero-glow-b), transparent 60%),
      var(--hero-grad);
  }
  .hero::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.16) 1px, transparent 1.6px);
    background-size: 26px 26px;
    -webkit-mask-image: linear-gradient(115deg, transparent 30%, rgba(0,0,0,.9));
            mask-image: linear-gradient(115deg, transparent 30%, rgba(0,0,0,.9));
    pointer-events: none;
  }
  .hero::after {
    content: "";
    position: absolute;
    right: -120px; top: -140px;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--hero-orb), transparent 65%);
    filter: blur(10px);
    pointer-events: none;
  }
  .hero .wrap { padding: 0 16px; position: relative; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--hero-tint);
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.18);
    padding: 6px 12px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    margin-bottom: 16px;
  }
  .eyebrow .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--live-dot);
    box-shadow: 0 0 8px var(--live-dot);
    animation: pulse 2.2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .hero h1 {
    margin: 0;
    font-size: clamp(30px, 5.5vw, 44px);
    font-weight: 800;
    letter-spacing: -.025em;
    line-height: 1.08;
  }
  .hero h1 .grad {
    background: var(--title-grad);
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
  }
  .hero p { margin: 12px 0 0; opacity: .88; font-size: 15px; max-width: 46ch; line-height: 1.55; }
  .hero .stats { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .hero .stats span {
    display: flex; align-items: baseline; gap: 7px;
    font-size: 12.5px; color: var(--hero-tint-2);
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.16);
    padding: 8px 14px;
    border-radius: 12px;
    backdrop-filter: blur(6px);
  }
  .hero .stats b { font-size: 18px; font-weight: 800; color: #fff; font-family: "Outfit", sans-serif; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 56px; }

  /* ---------- Floating filter panel ---------- */
  .panel {
    background: color-mix(in srgb, var(--card) 82%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow-hover);
    padding: 18px;
    margin-top: -56px;
    position: relative;
  }
  .panel .row + .row { margin-top: 14px; }
  .label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }

  .searchbox { position: relative; flex: 1; }
  .searchbox svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); }
  .search {
    width: 100%;
    padding: 11px 14px 11px 38px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .sort {
    padding: 11px 12px;
    font-size: 13px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    cursor: pointer;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  /* On phones, swipe through cards in one row instead of a tall wall of chips */
  @media (max-width: 640px) {
    #cardChips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    #cardChips::-webkit-scrollbar { display: none; }
    .controls .searchbox, .controls .sort { flex: 1 1 100%; }
  }
  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: var(--chip);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 15px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    user-select: none;
    transition: all .15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on {
    background: var(--brand);
    border-color: var(--brand);
    color: var(--brand-on);
    font-weight: 600;
    box-shadow: 0 2px 8px var(--chip-shadow);
  }
  .chip .tick { display: none; font-weight: 800; }
  .chip.on .tick { display: inline; }

  .count { color: var(--muted); font-size: 13px; margin: 20px 2px 12px; }

  /* ---------- Offer cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .offer {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease;
    position: relative;
  }
  .offer:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .offer:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, var(--accent-soft), var(--bg));
    overflow: hidden;
  }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .3s ease;
  }
  .offer:hover .thumb img { transform: scale(1.04); }
  /* Once the picture is in, hide the letter (it showed through transparent
     logos) and give logos the white backdrop they're designed for. */
  .thumb.loaded { background: #fff; }
  .thumb.loaded .initial { display: none; }
  .thumb .initial {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 800; color: var(--accent);
    opacity: .5;
  }
  .badge {
    position: absolute; left: 10px; bottom: 10px;
    background: var(--deal);
    color: var(--deal-on);
    font-size: 12px; font-weight: 700;
    padding: 5px 10px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    max-width: calc(100% - 58px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fav {
    position: absolute; top: 10px; right: 10px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(0,0,0,.45);
    color: #fff;
    font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, background .15s;
    z-index: 2;
  }
  .fav:hover { transform: scale(1.12); }
  .fav.on { background: var(--brand); color: var(--brand-on); }
  .soon {
    position: absolute; top: 10px; left: 10px;
    background: var(--danger);
    color: #fff;
    font-size: 10.5px; font-weight: 700;
    padding: 4px 8px;
    border-radius: 7px;
    text-transform: uppercase;
    letter-spacing: .03em;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .merchant { font-weight: 650; font-size: 15px; line-height: 1.3; }
  .new {
    display: inline-block; vertical-align: 2px; margin-right: 6px;
    background: var(--brand); color: var(--brand-on);
    font-family: "Inter", sans-serif; font-size: 10px; font-weight: 800;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 5px;
  }
  .desc {
    color: var(--muted); font-size: 12.5px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 8px; }
  .tag {
    font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
  }
  .tag.kind { background: var(--card); color: var(--text); border-color: var(--border); }
  .tag.cat { background: var(--cat-bg); color: var(--cat-text); border-color: transparent; }
  .tag.bank { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
  .tag.expiry { background: var(--danger-soft); color: var(--danger); border-color: transparent; }

  [hidden] { display: none !important; }
  .more {
    display: block;
    margin: 24px auto 0;
    padding: 12px 28px;
    font-size: 14px; font-weight: 650; font-family: inherit;
    color: var(--accent-ink);
    background: var(--accent-soft);
    border: none; border-radius: 12px;
    cursor: pointer;
  }
  .more:hover { filter: brightness(.96); }

  .empty { text-align: center; color: var(--muted); padding: 64px 0; }
  .empty .big { font-size: 40px; margin-bottom: 8px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }

  /* ---------- Detail modal ---------- */
  .modal-bg {
    position: fixed; inset: 0;
    background: var(--overlay);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    padding: 0;
  }
  .modal-bg.open { display: flex; }
  @media (min-width: 640px) { .modal-bg { align-items: center; padding: 24px; } }
  .modal {
    background: var(--card);
    width: 100%; max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    animation: up .22s ease;
  }
  @media (min-width: 640px) { .modal { border-radius: 20px; animation: pop .18s ease; } }
  @keyframes up  { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  @keyframes pop { from { transform: scale(.96); opacity: .6; } to { transform: none; opacity: 1; } }

  .modal .mthumb { position: relative; aspect-ratio: 16 / 9; background: linear-gradient(135deg, var(--accent-soft), var(--bg)); }
  .modal .mthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mclose {
    position: absolute; top: 12px; right: 12px;
    width: 34px; height: 34px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(0,0,0,.5); color: #fff;
    font-size: 17px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .mbody { padding: 18px 20px 24px; }
  .mbody h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; }
  .mdiscount { color: var(--deal-ink); font-weight: 800; font-size: 16px; margin-bottom: 10px; }
  .mdesc { font-size: 14px; line-height: 1.6; color: var(--text); }
  .mrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .msec { margin-top: 16px; }
  .msec summary {
    cursor: pointer; font-weight: 650; font-size: 13.5px;
    padding: 10px 0; border-top: 1px solid var(--border);
    list-style: none; display: flex; justify-content: space-between; align-items: center;
  }
  .msec summary::after { content: "+"; color: var(--muted); font-size: 16px; }
  .msec[open] summary::after { content: "–"; }
  .msec .inner { font-size: 13px; color: var(--muted); line-height: 1.65; padding-bottom: 10px; }
  .mlink {
    display: inline-block; margin-top: 16px;
    color: var(--accent-ink); font-weight: 650; font-size: 13.5px;
    text-decoration: none;
  }
  .mlink:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span> Updated daily</div>
    <h1>Credit Card <span class="grad">Offers LK</span></h1>
    <p>Every credit &amp; debit card discount from Sri Lanka's banks — pick your cards, see only what's yours.</p>
    <div class="stats">
      <span><b id="statOffers">–</b> offers</span>
      <span><b id="statBanks">–</b> banks</span>
      <span><b id="statCats">–</b> categories</span>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="panel">
    <div class="row">
      <div class="label">I pay with</div>
      <div class="chips" id="kindChips"></div>
    </div>
    <div class="row">
      <div class="label">My cards</div>
      <div class="chips" id="cardChips"></div>
    </div>
    <div class="row">
      <div class="label">Category</div>
      <div class="chips scroll" id="catChips"></div>
    </div>
    <div class="row controls">
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search" id="search" placeholder="Search merchant — Pizza, Hotel, Keells…">
      </div>
      <select class="sort" id="sort" aria-label="Sort offers">
        <option value="newest">Sort: Newest first</option>
        <option value="featured">Featured</option>
        <option value="ending">Ending soon</option>
        <option value="discount">Biggest discount</option>
        <option value="az">Merchant A–Z</option>
      </select>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>Show more</button>
  <div class="empty" id="empty" hidden>
    <div class="big">🔍</div>
    No offers match your cards and filters.
  </div>

  <footer id="footer"></footer>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script>
const CARD_OPTIONS = [
  { key: "sampath-visa",       label: "Sampath Visa",       bank: "Sampath Bank",    network: "visa" },
  { key: "sampath-mastercard", label: "Sampath Mastercard", bank: "Sampath Bank",    network: "mastercard" },
  { key: "sampath-amex",       label: "Sampath Amex",       bank: "Sampath Bank",    network: "amex" },
  { key: "combank-visa",       label: "ComBank Visa",       bank: "Commercial Bank", network: "visa" },
  { key: "combank-mastercard", label: "ComBank Mastercard", bank: "Commercial Bank", network: "mastercard" },
  { key: "hnb-visa",           label: "HNB Visa",           bank: "HNB",             network: "visa" },
  { key: "hnb-mastercard",     label: "HNB Mastercard",     bank: "HNB",             network: "mastercard" },
  { key: "hnb-amex",           label: "HNB Amex",           bank: "HNB",             network: "amex" },
  { key: "seylan-visa",        label: "Seylan Visa",        bank: "Seylan Bank",     network: "visa" },
  { key: "seylan-mastercard",  label: "Seylan Mastercard",  bank: "Seylan Bank",     network: "mastercard" },
  { key: "ntb-visa",           label: "NTB Visa",           bank: "Nations Trust",   network: "visa" },
  { key: "ntb-mastercard",     label: "NTB Mastercard",     bank: "Nations Trust",   network: "mastercard" },
  { key: "ntb-amex",           label: "NTB Amex",           bank: "Nations Trust",   network: "amex" },
  { key: "boc-visa",           label: "BOC Visa",           bank: "BOC",             network: "visa" },
  { key: "boc-mastercard",     label: "BOC Mastercard",     bank: "BOC",             network: "mastercard" },
  { key: "ndb-visa",           label: "NDB Visa",           bank: "NDB",             network: "visa" },
  { key: "ndb-mastercard",     label: "NDB Mastercard",     bank: "NDB",             network: "mastercard" },
  { key: "peoples-visa",       label: "Peoples Visa",       bank: "Peoples Bank",    network: "visa" },
  { key: "peoples-mastercard", label: "Peoples Mastercard", bank: "Peoples Bank",    network: "mastercard" },
  { key: "dfcc-visa",          label: "DFCC Visa",          bank: "DFCC",            network: "visa" },
  { key: "dfcc-mastercard",    label: "DFCC Mastercard",    bank: "DFCC",            network: "mastercard" },
];

const PAGE = 48;              // cards rendered per batch
const SOON_DAYS = 7;          // "ending soon" threshold
const NEW_DAYS = 7;           // "New" label for offers first seen this recently

let offers = [];
let myCards = new Set();
let myKinds = new Set();   // "credit" / "debit": which kind of card the user pays with
let favs = new Set();
let activeCat = "All";
let query = "";
let sortMode = "newest";
let shown = PAGE;             // how many of the filtered list are rendered

// "voex-*" keys are read once as a fallback so earlier selections survive the rename
try { myCards = new Set(JSON.parse(localStorage.getItem("coc-cards") || localStorage.getItem("voex-cards") || "[]")); } catch (e) {}
try { favs = new Set(JSON.parse(localStorage.getItem("coc-favs") || localStorage.getItem("voex-favs") || "[]")); } catch (e) {}
try { myKinds = new Set(JSON.parse(localStorage.getItem("coc-kinds") || "[]")); } catch (e) {}
function saveCards() { try { localStorage.setItem("coc-cards", JSON.stringify([...myCards])); } catch (e) {} }
function saveKinds() { try { localStorage.setItem("coc-kinds", JSON.stringify([...myKinds])); } catch (e) {} }
function saveFavs()  { try { localStorage.setItem("coc-favs",  JSON.stringify([...favs]));   } catch (e) {} }

function esc(s) {
  return String(s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

/* ---------- derive sort keys once per offer ---------- */
const MONTHS = { january:0, february:1, march:2, april:3, may:4, june:5,
                 july:6, august:7, september:8, october:9, november:10, december:11 };

// Pull an end date out of the many period formats the banks use:
// "2026-09-07 to 2026-11-30", "Valid Until 2026-12-31",
// "Offer valid till 31st December 2026", "Valid on 25 November 2026"...
function parseEndDate(period, endDate) {
  // The scraper now supplies a clean end_date (YYYY-MM-DD); use it first.
  if (endDate) {
    const d = new Date(endDate + "T23:59:59");
    if (!isNaN(d)) return d;
  }
  if (!period) return null;
  const isoDates = period.match(/\d{4}-\d{2}-\d{2}/g);
  if (isoDates) {
    const d = new Date(isoDates[isoDates.length - 1] + "T23:59:59");
    return isNaN(d) ? null : d;
  }
  const words = [...period.matchAll(/(\d{1,2})(?:st|nd|rd|th)?\s+(january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{4})/gi)];
  if (words.length) {
    const m = words[words.length - 1];
    return new Date(+m[3], MONTHS[m[2].toLowerCase()], +m[1], 23, 59, 59);
  }
  return null;
}

function parsePercent(o) {
  const m = (o.discount || o.description || "").match(/(\d{1,3})\s*%/);
  return m ? +m[1] : 0;
}

function discountLine(o) {
  if (o.discount) return o.discount;
  const m = (o.description || "").match(/(up to\s+)?\d{1,3}\s*%(\s*(discount|off))?/i);
  return m ? m[0].replace(/\s+/g, " ").trim() : "";
}

function prepare() {
  const now = new Date();
  for (const o of offers) {
    o._end = parseEndDate(o.period, o.end_date);
    o._pct = parsePercent(o);
    // Whole days left after today (0 = ends tonight); past its 23:59:59 = expired.
    o._days = o._end ? Math.floor((o._end - now) / 86400000) : null;
    o._expired = o._end ? o._end < now : false;
    o._soon = !o._expired && o._days !== null && o._days <= SOON_DAYS;
    o._endText = o._end ? `${o._end.getFullYear()}-${String(o._end.getMonth() + 1).padStart(2, "0")}-${String(o._end.getDate()).padStart(2, "0")}` : "";
    o._search = fold([o.merchant, o.description, o.bank, o.category, o.city].join(" "));
    // first_seen: the day our scraper first found the offer ("" = older)
    o._seen = o.first_seen || "";
    o._new = !!o._seen && (now - new Date(o._seen + "T00:00:00")) / 86400000 < NEW_DAYS;
  }
}

/* ---------- filtering + sorting ---------- */
function offerMatchesCards(offer) {
  if (myCards.size === 0) return true;
  for (const key of myCards) {
    const card = CARD_OPTIONS.find(c => c.key === key);
    if (!card || card.bank !== offer.bank) continue;
    const networks = (offer.card_types || []).filter(t => ["visa","mastercard","amex"].includes(t));
    if (networks.length === 0 || networks.includes(card.network)) return true;
  }
  return false;
}

// Banks often run the same deal at different rates for credit and debit
// cards (HNB Subway: 20% credit, 15% debit), listed as separate offers.
function offerKinds(o) {
  return (o.card_types || []).filter(t => t === "credit" || t === "debit");
}
function offerMatchesKind(o) {
  if (myKinds.size === 0) return true;
  const kinds = offerKinds(o);
  return kinds.length === 0 || kinds.some(k => myKinds.has(k));  // unstated = any card
}
function kindLabel(o) {
  const k = offerKinds(o);
  return k.length === 2 ? "Credit & Debit" : k[0] === "credit" ? "Credit cards" : k[0] === "debit" ? "Debit cards" : "";
}

// Lower-case, accents removed ("Café" -> "cafe"), spaces collapsed.
function fold(s) {
  return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ");
}

function visibleOffers() {
  // Every word typed must appear somewhere: "hnb pizza" finds HNB's pizza deals.
  const words = fold(query).trim().split(" ").filter(Boolean);
  let list = offers.filter(o =>
    !o._expired &&
    offerMatchesCards(o) &&
    offerMatchesKind(o) &&
    (activeCat === "All" ? true :
     activeCat === "♥ Saved" ? favs.has(o.id) :
     o.category === activeCat) &&
    (!words.length || words.every(w => o._search.includes(w)))
  );
  if (sortMode === "newest") {
    // Newest first; older offers keep the banks' own order (sort is stable).
    list = list.slice().sort((a, b) => (b._seen > a._seen) - (b._seen < a._seen));
  } else if (sortMode === "ending") {
    list = list.slice().sort((a, b) => (a._end ?? Infinity) - (b._end ?? Infinity));
  } else if (sortMode === "discount") {
    list = list.slice().sort((a, b) => b._pct - a._pct);
  } else if (sortMode === "az") {
    list = list.slice().sort((a, b) => a.merchant.localeCompare(b.merchant));
  }
  return list;
}

/* ---------- rendering ---------- */
function cardHTML(o) {
  const d = discountLine(o);
  const initial = esc((o.merchant || "?").trim().charAt(0).toUpperCase());
  return `
    <div class="offer" tabindex="0" data-id="${esc(o.id)}">
      <div class="thumb">
        <div class="initial">${initial}</div>
        ${o.image_url ? `<img src="${esc(o.image_url)}" alt="" loading="lazy" onload="this.parentNode.classList.add('loaded')" onerror="this.remove()">` : ""}
        ${o._soon ? `<div class="soon">${o._days === 0 ? "Last day" : o._days === 1 ? "1 day left" : o._days + " days left"}</div>` : ""}
        ${d ? `<div class="badge">${esc(d)}</div>` : ""}
        <button class="fav${favs.has(o.id) ? " on" : ""}" aria-label="Save offer">${favs.has(o.id) ? "♥" : "♡"}</button>
      </div>
      <div class="body">
        <div class="merchant">${o._new ? `<span class="new">New</span>` : ""}${esc(o.merchant)}</div>
        <div class="desc">${esc(o.description)}</div>
        <div class="meta">
          <span class="tag bank">${esc(o.bank)}</span>
          ${kindLabel(o) ? `<span class="tag kind">${kindLabel(o)}</span>` : ""}
          <span class="tag cat">${esc(o.category)}</span>
          ${o._end && !o._soon ? `<span class="tag">until ${o._endText}</span>` : ""}
          ${o._soon ? `<span class="tag expiry">ends ${o._endText}</span>` : ""}
        </div>
      </div>
    </div>`;
}

function attachCardEvents(root) {
  root.querySelectorAll(".offer:not([data-wired])").forEach(el => {
    el.dataset.wired = "1";
    const o = offers.find(x => x.id === el.dataset.id);
    el.addEventListener("click", e => {
      if (e.target.closest(".fav")) return;
      openModal(o);
    });
    el.addEventListener("keydown", e => {
      if (e.target !== el) return;  // Enter on the heart button only saves
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(o); }
    });
    el.querySelector(".fav").addEventListener("click", () => toggleFav(o.id, el));
  });
}

function toggleFav(id, el) {
  favs.has(id) ? favs.delete(id) : favs.add(id);
  saveFavs();
  const btn = el && el.querySelector(".fav");
  if (btn) {
    btn.classList.toggle("on", favs.has(id));
    btn.textContent = favs.has(id) ? "♥" : "♡";
  }
  renderCatChips();                       // keep the Saved count fresh
  if (activeCat === "♥ Saved") render();  // removing from Saved view hides it
}

let lastList = [];
function render(reset = true) {
  if (reset) shown = PAGE;
  lastList = visibleOffers();
  const soonCount = lastList.filter(o => o._soon).length;
  const newCount = lastList.filter(o => o._new).length;
  document.getElementById("count").textContent =
    `${lastList.length} offer${lastList.length === 1 ? "" : "s"}` +
    (myCards.size || myKinds.size ? " for your cards" : " — select your cards to personalise") +
    (newCount ? ` · ${newCount} new this week` : "") +
    (soonCount ? ` · ${soonCount} ending within a week` : "");
  document.getElementById("empty").hidden = lastList.length > 0;

  const slice = lastList.slice(0, shown);
  const grid = document.getElementById("grid");
  grid.innerHTML = slice.map(cardHTML).join("");
  attachCardEvents(grid);
  document.getElementById("more").hidden = lastList.length <= shown;
}

function showMore() {
  shown += PAGE;
  const grid = document.getElementById("grid");
  grid.insertAdjacentHTML("beforeend",
    lastList.slice(grid.children.length, shown).map(cardHTML).join(""));
  attachCardEvents(grid);
  document.getElementById("more").hidden = lastList.length <= shown;
}
document.getElementById("more").addEventListener("click", showMore);

// Auto-load the next batch when the button scrolls into view.
new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && !document.getElementById("more").hidden) showMore();
}, { rootMargin: "600px" }).observe(document.getElementById("more"));

/* ---------- modal ---------- */
function openModal(o) {
  const modal = document.getElementById("modal");
  const d = discountLine(o);
  modal.innerHTML = `
    <div class="mthumb">
      ${o.image_url ? `<img src="${esc(o.image_url)}" alt="" onerror="this.remove()">` : ""}
      <button class="mclose" aria-label="Close">✕</button>
    </div>
    <div class="mbody">
      <h2>${esc(o.merchant)}</h2>
      ${d ? `<div class="mdiscount">${esc(d)}</div>` : ""}
      <div class="mdesc">${esc(o.description)}</div>
      <div class="mrow">
        <span class="tag bank">${esc(o.bank)}</span>
        ${kindLabel(o) ? `<span class="tag kind">${kindLabel(o)}</span>` : ""}
        <span class="tag cat">${esc(o.category)}</span>
        ${o.city ? `<span class="tag">📍 ${esc(o.city)}</span>` : ""}
        ${o.period ? `<span class="tag${o._soon ? " expiry" : ""}">🗓 ${esc(o.period)}</span>` : ""}
      </div>
      ${o.details ? `
        <details class="msec" open>
          <summary>Offer details</summary>
          <div class="inner">${esc(o.details)}</div>
        </details>` : ""}
      ${o.terms ? `
        <details class="msec">
          <summary>Terms &amp; conditions</summary>
          <div class="inner">${esc(o.terms)}</div>
        </details>` : ""}
      <a class="mlink" href="${esc(o.source_url)}" target="_blank" rel="noopener">
        View on ${esc(o.bank)} website →
      </a>
    </div>`;
  modal.querySelector(".mclose").onclick = closeModal;
  lastFocus = document.activeElement;
  document.getElementById("modalBg").classList.add("open");
  document.body.style.overflow = "hidden";
  modal.querySelector(".mclose").focus();
}
let lastFocus = null;
function closeModal() {
  const bg = document.getElementById("modalBg");
  if (!bg.classList.contains("open")) return;
  bg.classList.remove("open");
  document.body.style.overflow = "";
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
// Keep Tab inside the open dialog instead of wandering behind it.
document.addEventListener("keydown", e => {
  if (e.key !== "Tab" || !document.getElementById("modalBg").classList.contains("open")) return;
  const items = [...document.getElementById("modal").querySelectorAll("button, a, summary")];
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  else if (!document.getElementById("modal").contains(document.activeElement)) { e.preventDefault(); first.focus(); }
});
document.getElementById("modalBg").addEventListener("click", e => {
  if (e.target.id === "modalBg") closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ---------- filter chips ---------- */
const KIND_OPTIONS = [{ key: "credit", label: "Credit card" }, { key: "debit", label: "Debit card" }];
function renderKindChips() {
  const el = document.getElementById("kindChips");
  el.innerHTML = "";
  for (const k of KIND_OPTIONS) {
    const chip = document.createElement("button");
    chip.className = "chip" + (myKinds.has(k.key) ? " on" : "");
    chip.innerHTML = `<span class="tick">✓</span>${k.label}`;
    chip.onclick = () => {
      myKinds.has(k.key) ? myKinds.delete(k.key) : myKinds.add(k.key);
      saveKinds(); renderKindChips(); render();
    };
    el.appendChild(chip);
  }
}

function renderCardChips() {
  const el = document.getElementById("cardChips");
  el.innerHTML = "";
  for (const card of CARD_OPTIONS) {
    const chip = document.createElement("button");
    chip.className = "chip" + (myCards.has(card.key) ? " on" : "");
    chip.innerHTML = `<span class="tick">✓</span>${esc(card.label)}`;
    chip.onclick = () => {
      myCards.has(card.key) ? myCards.delete(card.key) : myCards.add(card.key);
      saveCards(); renderCardChips(); render();
    };
    el.appendChild(chip);
  }
}

let categories = [];
function renderCatChips() {
  const el = document.getElementById("catChips");
  el.innerHTML = "";
  // Count only saved offers that still exist (old ones expire away).
  const savedCount = offers.filter(o => !o._expired && favs.has(o.id)).length;
  const savedLabel = savedCount ? `♥ Saved (${savedCount})` : "♥ Saved";
  for (const cat of ["All", "♥ Saved", ...categories]) {
    const chip = document.createElement("button");
    chip.className = "chip" + (activeCat === cat ? " on" : "");
    chip.textContent = cat === "♥ Saved" ? savedLabel : cat;
    chip.onclick = () => { activeCat = cat; renderCatChips(); render(); };
    el.appendChild(chip);
  }
}

document.getElementById("search").addEventListener("input", e => {
  query = e.target.value; render();
});
document.getElementById("sort").addEventListener("change", e => {
  sortMode = e.target.value; render();
});

/* ---------- boot + live refresh ---------- */
let lastGenerated = "";
const EMPTY_HTML = document.getElementById("empty").innerHTML;

function loadData(initial) {
  // cache-bust so a freshly scraped offers.json is picked up immediately
  fetch("../data/offers.json?t=" + Date.now())
    .then(r => r.json())
    .then(data => {
      const empty = document.getElementById("empty");
      empty.innerHTML = EMPTY_HTML;   // clear any earlier "could not load" message
      if (!initial && data.generated_at === lastGenerated) {
        // Same data, but time has moved on: re-check what has expired.
        prepare(); renderCatChips(); render(false);
        return;
      }
      lastGenerated = data.generated_at;
      // Ids must be unique: favourites and the details popup look offers up by id.
      const seen = new Set();
      offers = data.offers.filter(o => !seen.has(o.id) && seen.add(o.id));
      prepare();
      categories = [...new Set(offers.map(o => o.category))].sort();
      if (activeCat !== "All" && activeCat !== "♥ Saved" && !categories.includes(activeCat)) activeCat = "All";
      document.getElementById("statOffers").textContent = offers.filter(o => !o._expired).length;
      document.getElementById("statBanks").textContent = data.banks.length;
      document.getElementById("statCats").textContent = categories.length;
      document.getElementById("footer").textContent =
        `Offers from ${data.banks.join(", ")} · data refreshed ${new Date(data.generated_at).toLocaleString()}`;
      renderKindChips();
      renderCardChips();
      renderCatChips();
      render(initial);   // on a background refresh, keep the scroll position
    })
    .catch(() => {
      if (!initial) return; // keep showing current data if a refresh fails
      const empty = document.getElementById("empty");
      empty.hidden = false;
      empty.textContent = "Couldn't load the offers. Check your internet connection and refresh the page.";
    });
}

loadData(true);
setInterval(() => loadData(false), 30 * 60 * 1000);          // every 30 min
document.addEventListener("visibilitychange", () => {         // and on return
  if (!document.hidden) loadData(false);
});
</script>
</body>
